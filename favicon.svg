<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="CUBE MAYHEM game icon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#2b1a52"/>
      <stop offset="46%" stop-color="#140d2e"/>
      <stop offset="100%" stop-color="#060410"/>
    </radialGradient>
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c0"/>
      <stop offset="26%" stop-color="#ffd24a"/>
      <stop offset="56%" stop-color="#ff7a1f"/>
      <stop offset="82%" stop-color="#ff3b2e"/>
      <stop offset="100%" stop-color="#ff5028" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="cubeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ad0bd"/>
